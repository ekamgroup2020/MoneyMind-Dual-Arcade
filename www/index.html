<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MoneyMind Dual Arcade - Ekam Group</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/game1.css">
  <link rel="stylesheet" href="css/game2.css">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <!-- Login Screen -->
  <div id="loginScreen" class="screen">
    <div class="login-container">
      <h1 data-i18n="appName">MoneyMind Dual Arcade</h1>
      <p class="brand">by <span data-i18n="ekamGroup">Ekam Group</span></p>
      
      <div class="tabs">
        <button class="tab-btn active" onclick="showLoginTab()">Login</button>
        <button class="tab-btn" onclick="showSignupTab()">Sign Up</button>
      </div>
      
      <form id="loginForm" class="auth-form">
        <input type="email" id="loginEmail" placeholder="Email" required>
        <input type="password" id="loginPassword" placeholder="Password" required>
        <button type="submit" class="btn-primary">Login</button>
      </form>
      
      <form id="signupForm" class="auth-form" style="display:none;">
        <input type="text" id="signupName" placeholder="Name" required>
        <input type="email" id="signupEmail" placeholder="Email" required>
        <input type="password" id="signupPassword" placeholder="Password" required>
        <button type="submit" class="btn-primary">Sign Up</button>
      </form>
    </div>
  </div>

  <!-- Main Menu -->
  <div id="mainMenu" class="screen" style="display:none;">
    <div class="menu-header">
      <h1 data-i18n="appName">MoneyMind Dual Arcade</h1>
      <p class="brand">by <span data-i18n="ekamGroup">Ekam Group</span></p>
    </div>
    
    <div class="user-stats">
      <div class="stat-box">
        <span class="stat-label">⭐</span>
        <span id="totalStars">0</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">₹</span>
        <span id="walletAmount">0</span>
      </div>
    </div>
    
    <div class="game-buttons">
      <button class="game-btn game1-btn" onclick="startGame1()">
        <span class="game-icon">💵</span>
        <span data-i18n="game1">Money Rain</span>
        <small>Level: <span id="menuGame1Level">1</span></small>
      </button>
      
      <button class="game-btn game2-btn" onclick="startGame2()">
        <span class="game-icon">🎨</span>
        <span data-i18n="game2">Color Trap</span>
        <small>Level: <span id="menuGame2Level">1</span></small>
      </button>
    </div>
    
    <div class="menu-buttons">
      <button class="menu-btn" onclick="showWallet()">
        <span>💳</span> <span data-i18n="wallet">Wallet</span>
      </button>
      <button class="menu-btn" onclick="showSettings()">
        <span>⚙️</span> <span data-i18n="settings">Settings</span>
      </button>
      <button class="menu-btn logout-btn" onclick="logout()">
        <span>🚪</span> <span data-i18n="logout">Logout</span>
      </button>
    </div>
  </div>

  <!-- Game 1: Money Rain -->
  <div id="game1Container" class="game-container" style="display:none;">
    <div class="game-header">
      <div class="stat">⏱️ <span id="game1Time">60</span>s</div>
      <div class="stat">💵 $<span id="game1Coins">0</span></div>
      <div class="stat" id="game1Level">L1 S1/5</div>
    </div>
    <div id="game1Area" class="game-area"></div>
    <div class="banner-ad-slot" id="game1Banner"></div>
  </div>

  <!-- Game 2: Color Trap -->
  <div id="game2Container" class="game-container" style="display:none;">
    <div class="game-header">
      <div class="stat">️ <span id="game2Time">30</span>s</div>
      <div class="stat">🏆 <span id="game2Score">0</span></div>
      <div class="stat" id="game2Level">L1 S1/5</div>
    </div>
    <div class="color-game-area">
      <div id="colorWord" class="color-word"></div>
      <div id="tapGrid" class="color-grid"></div>
    </div>
    <div class="banner-ad-slot" id="game2Banner"></div>
  </div>

  <!-- Wallet Screen -->
  <div id="walletScreen" class="screen" style="display:none;">
    <div class="wallet-container">
      <h2 data-i18n="wallet">Wallet</h2>
      
      <div class="wallet-balance">
        <div class="balance-item">
          <span class="label">⭐ Stars</span>
          <span id="walletStars">0</span>
        </div>
        <div class="balance-item">
          <span class="label">💰 Balance</span>
          <span id="walletBalance">₹0</span>
        </div>
      </div>
      
      <button class="btn-primary" onclick="convertStarsToWallet()">
        Convert 100 Stars → ₹10
      </button>
      
      <form id="withdrawalForm" class="withdrawal-form">
        <h3 data-i18n="withdraw">Withdraw</h3>
        <p class="min-withdraw" data-i18n="minWithdraw">Minimum: ₹1999</p>
        <input type="text" id="qrCodeInput" placeholder="Enter QR Code" required>
        <button type="submit" class="btn-primary">Submit Request</button>
      </form>
      
      <div class="withdrawal-history">
        <h3 data-i18n="withdrawalHistory">History</h3>
        <div id="withdrawalHistory"></div>
      </div>
      
      <button class="btn-secondary" onclick="showMainMenu()">Back</button>
    </div>
  </div>

  <!-- Settings Screen -->
  <div id="settingsScreen" class="screen" style="display:none;">
    <div class="settings-container">
      <h2 data-i18n="settings">Settings</h2>
      
      <div class="setting-item">
        <label data-i18n="changeLanguage">Change Language</label>
        <select id="languageSelect">
          <option value="en">English</option>
          <option value="hi">हिन्दी</option>
          <option value="pa">ਪੰਜਾਬੀ</option>
          <option value="ur">اردو</option>
          <option value="es">Español</option>
          <option value="ar">العربية</option>
        </select>
      </div>
      
      <button class="btn-secondary" onclick="showMainMenu()">Back</button>
    </div>
  </div>

  <!-- Game Over Screen -->
  <div id="gameOverScreen" class="overlay-screen" style="display:none;">
    <div class="overlay-content">
      <h2 data-i18n="gameOver">Game Over</h2>
      <p>Score: <span id="finalScore">0</span></p>
      <button class="btn-primary" onclick="showMainMenu()" data-i18n="backToMenu">Back to Menu</button>
    </div>
  </div>

  <!-- Level Complete Screen -->
  <div id="levelCompleteScreen" class="overlay-screen" style="display:none;">
    <div class="overlay-content">
      <h2 id="levelCompleteText">Level Complete!</h2>
      <p id="starsEarned">⭐ 1 Star</p>
      <button class="btn-primary" onclick="showMainMenu()" data-i18n="backToMenu">Back to Menu</button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="firebase-config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/ads.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/wallet.js"></script>
  <script src="js/game1.js"></script>
  <script src="js/game2.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
