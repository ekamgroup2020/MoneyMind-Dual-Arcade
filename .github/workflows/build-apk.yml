name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
    
    - name: Install Dependencies
      run: |
        npm install
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npm install capacitor-unity-ads
        npm install @martinezmanoloa/capacitor-startio-ads
    
    - name: Add Android Platform & Sync
      run: |
        npx cap add android || true
        npx cap sync android
    
    - name: Copy google-services.json to Android App
      run: |
        # ਇਹ ਕਮਾਂਡ ਤੁਹਾਡੀ Firebase ਫਾਈਲ ਨੂੰ ਸਹੀ ਥਾਂ 'ਤੇ ਪਾ ਦੇਵੇਗੀ ਤਾਂ ਜੋ OTP/Login ਕੰਮ ਕਰੇ
        if [ -f google-services.json ]; then
          cp google-services.json android/app/
          echo "✅ google-services.json copied successfully"
        else
          echo "⚠️ google-services.json not found in root directory"
        fi
    
    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
    
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MoneyMind-Dual-Arcade-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
