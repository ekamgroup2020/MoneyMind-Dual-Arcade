name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
    
    - name: Install Dependencies
      run: |
        npm install --legacy-peer-deps
        npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
        npm install capacitor-unity-ads --legacy-peer-deps
        npm install @martinezmanoloa/capacitor-startio-ads --legacy-peer-deps
    
    - name: Add Android Platform & Sync
      run: |
        npx cap add android || true
        npx cap sync android
    
    - name: Copy google-services.json to Android App
      run: |
        if [ -f google-services.json ]; then
          cp google-services.json android/app/
          echo "✅ google-services.json copied successfully"
        else
          echo "⚠️ google-services.json not found in root directory"
        fi
    
    - name: Fix Gradle, AGP, and SDK Versions (100% Foolproof Overwrite)
      run: |
        echo "=== Fixing Android Build Configuration ==="
        
        # 1. Force Gradle to 8.9
        sed -i 's|distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-all.zip|' android/gradle/wrapper/gradle-wrapper.properties
        
        # 2. Force AGP to 8.7.2
        sed -i "s/classpath 'com.android.tools.build:gradle:8.0.0'/classpath 'com.android.tools.build:gradle:8.7.2'/" android/build.gradle
        
        # 3. OVERWRITE variables.gradle to guarantee compileSdk 37 (Foolproof method)
        cat << 'EOF' > android/variables.gradle
        ext {
            minSdkVersion = 22
            compileSdkVersion = 37
            targetSdkVersion = 37
            androidxActivityVersion = '1.7.0'
            androidxAppCompatVersion = '1.6.1'
            androidxCoordinatorLayoutVersion = '1.2.0'
            androidxCoreVersion = '1.10.0'
            androidxFragmentVersion = '1.5.6'
            coreSplashScreenVersion = '1.0.0'
            androidxWebkitVersion = '1.6.1'
            junitVersion = '4.13.2'
            androidxJunitVersion = '1.1.5'
            androidxEspressoCoreVersion = '3.5.1'
            cordovaAndroidVersion = '10.1.1'
        }
        EOF
        
        # 4. Suppress unsupported compile SDK warning
        echo "android.suppressUnsupportedCompileSdk=37" >> android/gradle.properties
        
        echo "=== Verification ==="
        echo "--- gradle-wrapper.properties ---"
        grep "distributionUrl" android/gradle/wrapper/gradle-wrapper.properties
        echo "--- build.gradle classpath ---"
        grep "classpath" android/build.gradle
        echo "--- variables.gradle ---"
        cat android/variables.gradle

    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace --info
    
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MoneyMind-Dual-Arcade-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
