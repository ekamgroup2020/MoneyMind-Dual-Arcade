name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
    
    - name: Install Dependencies
      run: |
        npm install --legacy-peer-deps
        npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
        npm install capacitor-unity-ads --legacy-peer-deps
        npm install @martinezmanoloa/capacitor-startio-ads --legacy-peer-deps
    
    - name: Add Android Platform & Sync
      run: |
        npx cap add android || true
        npx cap sync android
    
    - name: Copy google-services.json to Android App
      run: |
        if [ -f google-services.json ]; then
          cp google-services.json android/app/
          echo "✅ google-services.json copied successfully"
        else
          echo "⚠️ google-services.json not found in root directory"
        fi
    
    - name: Fix Gradle, AGP, and SDK Versions for Start.io
      run: |
        echo "=== BEFORE MODIFICATION ==="
        
        # 1. Update Gradle Wrapper to 8.9 (Required for AGP 8.7.2)
        sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.9-all.zip|' android/gradle/wrapper/gradle-wrapper.properties
        
        # 2. Update Android Gradle Plugin to 8.7.2 (supports API 37)
        sed -i "s/classpath 'com.android.tools.build:gradle:[0-9.]*'/classpath 'com.android.tools.build:gradle:8.7.2'/" android/build.gradle
        
        # 3. Force compileSdkVersion and targetSdkVersion to 37
        sed -i 's/compileSdkVersion[[:space:]]*=[[:space:]]*[0-9]\+/compileSdkVersion = 37/' android/variables.gradle
        sed -i 's/targetSdkVersion[[:space:]]*=[[:space:]]*[0-9]\+/targetSdkVersion = 37/' android/variables.gradle
        
        # 4. Suppress unsupported compile SDK warning
        echo "android.suppressUnsupportedCompileSdk=37" >> android/gradle.properties
        
        echo "=== AFTER MODIFICATION ==="
        echo "--- gradle-wrapper.properties ---"
        cat android/gradle/wrapper/gradle-wrapper.properties
        echo "--- build.gradle classpath ---"
        grep "classpath" android/build.gradle || true
        echo "--- variables.gradle ---"
        cat android/variables.gradle || true
    
    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace --info
    
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MoneyMind-Dual-Arcade-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
