name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
    
    - name: Install Dependencies
      run: |
        npm install --legacy-peer-deps
        npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
        npm install capacitor-unity-ads --legacy-peer-deps
        npm install @martinezmanoloa/capacitor-startio-ads --legacy-peer-deps
    
    - name: Add Android Platform & Sync
      run: |
        npx cap add android || true
        npx cap sync android
    
    - name: Copy google-services.json to Android App
      run: |
        if [ -f google-services.json ]; then
          cp google-services.json android/app/
          echo "✅ google-services.json copied successfully"
        else
          echo "⚠️ google-services.json not found in root directory"
        fi
    
    - name: Fix Gradle, AGP, and SDK Versions (Bulletproof Fix)
      run: |
        echo "=== BEFORE MODIFICATION ==="
        cat android/gradle/wrapper/gradle-wrapper.properties || echo "Not found"
        grep "compileSdkVersion\|targetSdkVersion" android/variables.gradle || echo "Not found"
        
        # 1. Simple string replacement for Gradle (8.0.2 -> 8.9)
        sed -i 's/gradle-8.0.2-all.zip/gradle-8.9-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties
        
        # 2. Simple string replacement for AGP (8.0.0 -> 8.7.2)
        sed -i "s/classpath 'com.android.tools.build:gradle:8.0.0'/classpath 'com.android.tools.build:gradle:8.7.2'/g" android/build.gradle
        
        # 3. Simple string replacement for SDK (33 -> 37)
        sed -i 's/compileSdkVersion = 33/compileSdkVersion = 37/g' android/variables.gradle
        sed -i 's/targetSdkVersion = 33/targetSdkVersion = 37/g' android/variables.gradle
        
        # 4. Suppress unsupported compile SDK warning
        echo "android.suppressUnsupportedCompileSdk=37" >> android/gradle.properties
        
        echo "=== AFTER MODIFICATION ==="
        cat android/gradle/wrapper/gradle-wrapper.properties
        grep "compileSdkVersion\|targetSdkVersion" android/variables.gradle
        grep "classpath" android/build.gradle

    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace --info
    
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MoneyMind-Dual-Arcade-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
